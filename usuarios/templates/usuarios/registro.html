{% extends 'base.html' %}
{% block titulo %}Registro{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h2>Crear cuenta</h2>
    <form method="post" novalidate>
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-success">Registrarme</button>
    </form>
    <p class="mt-3">¿Ya tienes cuenta? <a href="{% url 'login' %}">Ingresa</a></p>
  </div>
</div>
{% endblock %}
