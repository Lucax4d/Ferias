{% extends 'base.html' %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2>{{ titulo }}</h2>
    <form method="post" novalidate>
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-success">Guardar</button>
      <a class="btn btn-secondary" href="{% url 'producto_lista' %}">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
