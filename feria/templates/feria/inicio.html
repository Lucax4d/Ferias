{% extends 'base.html' %}
{% block contenido %}
<h1>Productos de la feria</h1>
<table class="table table-striped">
  <thead><tr><th>Producto</th><th>Puesto</th><th>Precio</th><th>Stock</th></tr></thead>
  <tbody>
    {% for p in productos %}
      <tr><td>{{ p.nombre }}</td><td>{{ p.puesto.nombre }}</td><td>${{ p.precio }}</td><td>{{ p.stock }}</td></tr>
    {% empty %}
      <tr><td colspan="4">Aún no hay productos.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
