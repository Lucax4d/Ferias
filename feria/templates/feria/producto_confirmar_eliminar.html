{% extends 'base.html' %}
{% block titulo %}Eliminar producto{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2>Eliminar producto</h2>
    <p>¿Seguro que quieres eliminar <strong>{{ producto.nombre }}</strong>?
       Se quitará también de los carritos que lo contengan.</p>
    <form method="post">
      {% csrf_token %}
      <button class="btn btn-danger">Sí, eliminar</button>
      <a class="btn btn-secondary" href="{% url 'producto_lista' %}">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
